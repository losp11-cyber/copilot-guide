const $ = id => document.getElementById(id);
let lang = "ja";
let industry = "generic";
function readState() {
  const hash = new URLSearchParams(location.hash.slice(1));
  lang = hash.get("lang") === "en" ? "en" : "ja";
  industry = hash.get("ind") === "manufacturing" ? "manufacturing" : "generic";
}
function node(tag, text, className) {
  const el = document.createElement(tag);
  if (text !== undefined) el.textContent = text;
  if (className) el.className = className;
  return el;
}
function table(rows, title) {
  const u = UI[lang];
  const wrapper = node("div", undefined, "table-wrap");
  wrapper.tabIndex = 0;
  wrapper.setAttribute("role", "region");
  wrapper.setAttribute("aria-label", title);
  const t = node("table");
  t.append(node("caption", title, "sr-only"));
  const head = node("thead"), hr = node("tr");
  [u.feature, u.free, u.paid].forEach((label, i) => {
    const th = node("th", label); th.scope = "col";
    if (i) th.append(node("small", i === 1 ? u.freeSub : u.paidSub));
    hr.append(th);
  });
  head.append(hr); t.append(head);
  const body = node("tbody");
  rows.forEach(row => {
    const tr = node("tr"); tr.dataset.rowId = row.id;
    const feature = node("th", row[lang][0]); feature.scope = "row"; tr.append(feature);
    row.status.forEach((status, i) => {
      const td = node("td");
      // Scope and prerequisites stay in the description, not in a generic status badge.
      const displayStatus = status === "limited" ? "available" : status;
      td.append(node("span", u.status[displayStatus], "badge " + displayStatus), node("p", row[lang][i + 1], "cell-copy"));
      tr.append(td);
    });
    body.append(tr);
  });
  t.append(body); wrapper.append(t); return wrapper;
}
function syncLinks() {
  const theme = document.documentElement.getAttribute("data-theme");
  const query = "?scoutTheme=" + encodeURIComponent(theme);
  const hash = "#lang=" + lang + "&ind=" + industry;
  $("backLink").href = "index.html" + query + hash;
  $("updatesLink").href = "updates.html" + query + "#lang=" + lang;
  $("themeBtn").textContent = UI[lang][theme === "dark" ? "light" : "dark"];
}
function syncExpand() {
  const allOpen = [...document.querySelectorAll(".detail-group")].every(d => d.open);
  $("expandBtn").textContent = UI[lang][allOpen ? "collapse" : "expand"];
  $("expandBtn").setAttribute("aria-expanded", String(allOpen));
}
function render() {
  const openIds = new Set([...document.querySelectorAll(".detail-group[open]")].map(d => d.id));
  const u = UI[lang];
  document.documentElement.lang = lang;
  document.title = lang === "ja" ? "Copilot Chat と Microsoft 365 Copilot｜無償・有償の機能比較" : "Copilot Chat vs. Microsoft 365 Copilot | Feature comparison";
  $("title").textContent = u.title; $("lead").textContent = u.lead;
  $("reviewDate").textContent = u.date + REVIEWED_ON;
  $("backLink").textContent = u.back; $("langBtn").textContent = lang === "ja" ? "EN" : "日本語";
  $("langBtn").setAttribute("aria-label", lang === "ja" ? "Switch to English" : "日本語に切り替え");
  $("scopeText").textContent = u.scope; $("scopeNote").textContent = u.scopeNote;
  $("overviewTitle").textContent = u.overview; $("detailTitle").textContent = u.details;
  $("sourceTitle").textContent = u.sources; $("tableHint").textContent = u.hint;
  $("sourceNote").textContent = u.sourceNote; $("footerText").textContent = u.footer;
  $("updatesLink").textContent = u.updates;
  document.querySelector(".topbar").setAttribute("aria-label", lang === "ja" ? "ページ移動" : "Page navigation");
  $("jump").setAttribute("aria-label", lang === "ja" ? "ページ内の移動" : "On this page");
  $("jump").replaceChildren();
  ["overview","details","sources"].forEach(id => {
    const a = node("a", u[id]); a.href = "#"+id;
    a.addEventListener("click", event => {
      event.preventDefault();
      $(id).scrollIntoView({behavior: window.matchMedia("(prefers-reduced-motion: reduce)").matches ? "auto" : "smooth"});
      const heading = $(id).querySelector("h2");
      heading.tabIndex = -1; heading.focus({preventScroll:true});
    });
    $("jump").append(a);
  });
  $("overviewTable").replaceChildren(table(ROWS.filter(r => r.group === "overview"), u.overview));
  $("detailGroups").replaceChildren();
  GROUPS.forEach(group => {
    const d = node("details", undefined, "detail-group"); d.id = "group-" + group.id;
    d.open = openIds.has(d.id);
    const summary = node("summary", group[lang]);
    d.append(summary, table(ROWS.filter(r => r.group === group.id), group[lang]),
      node("p", group[lang + "Note"], "detail-note"));
    d.addEventListener("toggle", syncExpand);
    $("detailGroups").append(d);
  });
  $("sourceList").replaceChildren();
  Object.entries(SOURCES).forEach(([key, source]) => {
    const li = node("li"), a = node("a", source[lang]);
    a.href = source.url; a.target = "_blank"; a.rel = "noopener noreferrer";
    li.dataset.sourceKey = key; li.append(a, node("small", new URL(source.url).hostname));
    $("sourceList").append(li);
  });
  syncExpand(); syncLinks();
}
$("expandBtn").addEventListener("click", () => {
  const groups = [...document.querySelectorAll(".detail-group")];
  const expand = !groups.every(d => d.open);
  groups.forEach(d => { d.open = expand; }); syncExpand();
});
$("langBtn").addEventListener("click", () => {
  lang = lang === "ja" ? "en" : "ja";
  location.hash = "lang=" + lang + "&ind=" + industry;
});
$("themeBtn").addEventListener("click", () => {
  const theme = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", theme); syncLinks();
});
window.addEventListener("hashchange", () => { readState(); render(); });
readState(); render();
</script>
